[project]
name = "sec-rag-assignment"
version = "0.1.0"
description = "Trustworthy RAG for SEC filing analysis"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.40.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.0.0",
    "numpy>=1.26.0",
    "pypdf>=4.0.0",
    "streamlit>=1.38.0",
    "python-dotenv>=1.2.2",
    "langfuse>=2.0.0",
    "cohere>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5.0",
    "pytest>=8.0.0",
]

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
]
